[project]
name = "linkedin-sales-nav-mcp"
version = "1.2.0"
description = "MCP server that gives AI assistants access to LinkedIn Sales Navigator contact and account search."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "nick-choudhary" }
]
license = "MIT"
keywords = [
    "mcp",
    "model-context-protocol",
    "linkedin",
    "sales-navigator",
    "browser-automation",
    "ai",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=3.4.4",
    "patchright>=1.55.0",
    "python-dotenv>=1.1.1",
]

[project.scripts]
linkedin-sales-nav-mcp = "sales_nav_mcp.cli_main:main"

[project.urls]
Homepage = "https://github.com/nick-choudhary/linkedin-sales-nav-mcp"
Repository = "https://github.com/nick-choudhary/linkedin-sales-nav-mcp"
Issues = "https://github.com/nick-choudhary/linkedin-sales-nav-mcp/issues"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sales_nav_mcp*"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.11",
]

[tool.ruff.lint]
# Explicit selection so lint results don't shift when ruff's defaults change.
# BLE/S are left out: blind `except Exception` is deliberate around browser
# teardown and capture parsing, where any failure must degrade gracefully.
select = ["E4", "E7", "E9", "F", "B", "I", "SIM", "UP"]
